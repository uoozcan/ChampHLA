name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run tests
        run: pytest tests/ -v

  # Nothing in this repository parsed a .nf file until now, so a malformed process
  # block could reach main and break the pipeline for everyone while the Python
  # tests stayed green. `-preview` builds the workflow and compiles every module
  # without executing a single task.
  #
  # What it catches: module compilation errors -- unbalanced braces or quotes, bad
  # DSL structure -- reported with file and line.
  # What it does NOT catch: undefined variables inside a process script body, which
  # are only evaluated when a task is submitted. This is a syntax gate, not a
  # semantic one.
  nextflow-parses:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Nextflow
        run: |
          curl -s https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/
          nextflow -version

      - name: Compile the workflow and every module
        run: |
          nextflow run main.nf -preview -profile standard             --input /tmp --input_type bam             --tools optitype,arcashla,spechla,hlahd,t1k,kourami,polysolver,seq2hla             --hlahd_db /tmp --t1k_hlaidx /tmp             --outdir /tmp/preview_out

truth:
  imgt_hla_version: 3.59.0
  path: /absolute/path/to/1000g_hla_truth.tsv
  source: ftp://ftp.1000genomes.ebi.ac.uk/vol1/ftp/technical/working/20140725_hla_genotypes/
  acquisition_date: 2014-07-25
  supported_loci:
    - A
    - B
    - C
    - DRB1
    - DQB1

manifests:
  sequencing_source: /absolute/path/to/1000g_sequencing_source.tsv
  population_manifest: /absolute/path/to/1000g_population_manifest.tsv

benchmark:
  resolution: 2
  secondary_resolutions:
    - 2
    - 3
  consensus:
    min_support: 0.55
    min_margin: 0.15

# Reporting guardrails:
# - latest/reporting benchmark outputs must not be generated from tests/fixtures-backed inputs
# - scientific-reporting scope additionally requires the full loci set A,B,C,DRB1,DQB1
# - smaller exploratory runs are still allowed, but they will be marked partial_realdata_benchmark

# This config assumes tool outputs are produced by native pihla Nextflow runs.
# Expected output layout:
#   /absolute/path/to/pipeline_results/<modality>/<sample>/<tool>/<sample>_<tool>.txt
runs:
  - tool: SpecHLA
    modality: wgs
    parser: long_hla_table
    result_glob: /absolute/path/to/pipeline_results/wgs/*/spechla/*_spechla.txt
    sample_from_path_regex: /([^/]+)_spechla\.txt$

  - tool: HLA-HD
    modality: wgs
    parser: hlahd_table
    result_glob: /absolute/path/to/pipeline_results/wgs/*/hlahd/*_hlahd.txt
    sample_from_path_regex: /([^/]+)_hlahd\.txt$

  - tool: ArcasHLA
    modality: wgs
    parser: long_hla_table
    result_glob: /absolute/path/to/pipeline_results/wgs/*/arcashla/*_arcashla.txt
    sample_from_path_regex: /([^/]+)_arcashla\.txt$

  - tool: OptiType
    modality: wgs
    parser: long_hla_table
    result_glob: /absolute/path/to/pipeline_results/wgs/*/optitype/*_optitype.txt
    sample_from_path_regex: /([^/]+)_optitype\.txt$

  - tool: POLYSOLVER
    modality: wgs
    parser: polysolver_table
    result_glob: /absolute/path/to/pipeline_results/wgs/*/polysolver/*_polysolver.txt
    sample_from_path_regex: /([^/]+)_polysolver\.txt$

  - tool: Kourami

benchmark:
  consensus:
    min_margin: 0.15
    min_support: 0.55
  resolution: 2
  secondary_resolutions:
  - 2
  - 3
  split_seed: 1003
  splits:
    holdout: final_reporting
    training: calibration
    validation: threshold_tuning
  tool_coverage_policy: phase_gated
manifests:
  sequencing_source: /scratch/project_2008084/pihla-publish/analysis/1000g_realdata/full_cohort_inputs/sequencing_source_rna.tsv
runs:
# ── RNA-seq only ──────────────────────────────────────────────────────────────
- confidence_defaults:
    target_reads: 50
  confidence_glob: /scratch/project_2008084/hla_calibration/rna_batches/*/results/**/arcashla/*/*.genes.json
  confidence_parser: arcashla_genes_confidence
  confidence_sample_from_path_regex: /results/([^/]+)/arcashla/
  modality: rnaseq
  parser: long_hla_table
  result_glob: /scratch/project_2008084/hla_calibration/rna_batches/*/results/**/*_arcashla.txt
  sample_from_path_regex: /results/([^/]+)/arcashla/
  tool: ArcasHLA
- confidence_glob: /scratch/project_2008084/hla_calibration/rna_batches/*/results/**/optitype/*/*_result.tsv
  confidence_parser: optitype_result_objective
  confidence_sample_from_path_regex: /results/([^/]+)/optitype/
  modality: rnaseq
  parser: long_hla_table
  result_glob: /scratch/project_2008084/hla_calibration/rna_batches/*/results/**/*_optitype.txt
  sample_from_path_regex: /results/([^/]+)/optitype/
  tool: OptiType
- modality: rnaseq
  parser: seq2hla_table
  result_glob: /scratch/project_2008084/hla_calibration/rna_batches/*/results/**/*_seq2hla.txt
  sample_from_path_regex: /results/([^/]+)/seq2hla/
  tool: Seq2HLA
- confidence_defaults:
    target_reads: 50
  confidence_glob: /scratch/project_2008084/hla_calibration/rna_batches/*/results/**/t1k/t1k_out/*_genotype.tsv
  confidence_parser: t1k_genotype_confidence
  confidence_sample_from_path_regex: /results/([^/]+)/t1k/
  modality: rnaseq
  parser: t1k_table
  result_glob: /scratch/project_2008084/hla_calibration/rna_batches/*/results/**/*_t1k.txt
  sample_from_path_regex: /results/([^/]+)/t1k/
  tool: T1K
- confidence_defaults:
    target_reads: 50
  confidence_glob: /scratch/project_2008084/hla_calibration/rna_batches/*/results/**/hlahd/*/*/result/*_*.read.txt
  confidence_parser: hlahd_read_confidence
  confidence_sample_from_path_regex: /results/([^/]+)/hlahd/
  modality: rnaseq
  parser: hlahd_table
  result_glob: /scratch/project_2008084/hla_calibration/rna_batches/*/results/**/*_hlahd.txt
  sample_from_path_regex: /results/([^/]+)/hlahd/
  tool: HLA-HD
# NOTE: SpecHLA excluded from RNA accuracy scoring — DNA-seq tool; RNA reads produce high N-masking,
# resulting in systematic no-calls (~50% blank). Kept here for coverage tracking only.
- coverage_only: true
  modality: rnaseq
  parser: long_hla_table
  result_glob: /scratch/project_2008084/hla_calibration/rna_batches/*/results/**/*_spechla.txt
  sample_from_path_regex: /results/([^/]+)/spechla/
  tool: SpecHLA
truth:
  acquisition_date: 2014-07-25
  imgt_hla_version: 3.59.0
  path: /scratch/project_2008084/pihla-publish/analysis/1000g_realdata/full_cohort_inputs/truth_long.tsv
  source: ftp://ftp.1000genomes.ebi.ac.uk/vol1/ftp/technical/working/20140725_hla_genotypes/
  supported_loci:
  - A
  - B
  - C

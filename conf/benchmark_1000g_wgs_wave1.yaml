benchmark:
  consensus:
    min_margin: 0.15
    min_support: 0.55
  resolution: 2
  secondary_resolutions:
  - 2
  - 3
  tool_coverage_policy: phase_gated
manifests:
  cohort_manifest: /scratch/project_2008084/pihla-publish/analysis/1000g_realdata/wgs_wave1_inputs/cohort_manifest.tsv
  sequencing_manifest: /scratch/project_2008084/pihla-publish/analysis/1000g_realdata/wgs_wave1_inputs/sequencing_manifest.tsv
  truth_manifest: /scratch/project_2008084/pihla-publish/analysis/1000g_realdata/wgs_wave1_inputs/truth_manifest.tsv
runs:
- modality: wgs
  parser: long_hla_table
  result_glob: /scratch/project_2008084/hla_calibration/wgs/results/**/*_spechla.txt
  sample_from_path_regex: /([^/]+)_spechla\.txt$
  tool: SpecHLA
- confidence_defaults:
    target_reads: 50
  confidence_glob: /scratch/project_2008084/hla_calibration/wgs/results/**/hlahd/**/*_*.read.txt
  confidence_parser: hlahd_read_confidence
  confidence_sample_from_path_regex: /results/([^./]+)/hlahd/
  modality: wgs
  parser: hlahd_table
  result_glob: /scratch/project_2008084/hla_calibration/wgs/results/**/*_hlahd.txt
  sample_from_path_regex: /([^/]+)_hlahd\.txt$
  tool: HLA-HD
- confidence_defaults:
    target_reads: 50
  confidence_glob: /scratch/project_2008084/hla_calibration/wgs/results/**/arcashla/*/*.genes.json
  confidence_parser: arcashla_genes_confidence
  confidence_sample_from_path_regex: /results/([^./]+)/arcashla/
  modality: wgs
  parser: long_hla_table
  result_glob: /scratch/project_2008084/hla_calibration/wgs/results/**/*_arcashla.txt
  sample_from_path_regex: /([^/]+)_arcashla\.txt$
  tool: ArcasHLA
- confidence_glob: /scratch/project_2008084/hla_calibration/wgs/results/**/optitype/*/*_result.tsv
  confidence_parser: optitype_result_objective
  confidence_sample_from_path_regex: /results/([^./]+)/optitype/
  modality: wgs
  parser: long_hla_table
  result_glob: /scratch/project_2008084/hla_calibration/wgs/results/**/*_optitype.txt
  sample_from_path_regex: /([^/]+)_optitype\.txt$
  tool: OptiType
- modality: wgs
  parser: polysolver_table
  result_glob: /scratch/project_2008084/hla_calibration/wgs/results/**/*_polysolver.txt
  sample_from_path_regex: /([^/]+)_polysolver\.txt$
  tool: POLYSOLVER
- confidence_defaults:
    target_reads: 50
  confidence_glob: /scratch/project_2008084/hla_calibration/wgs/results/**/kourami/*.kourami.result
  confidence_parser: kourami_result_confidence
  confidence_sample_from_path_regex: /results/([^./]+)/kourami/
  modality: wgs
  parser: kourami_table
  result_glob: /scratch/project_2008084/hla_calibration/wgs/results/**/*_kourami.txt
  sample_from_path_regex: /([^/]+)_kourami\.txt$
  tool: Kourami
- confidence_defaults:
    target_reads: 50
  confidence_glob: /scratch/project_2008084/hla_calibration/wgs/results/**/t1k/t1k_out/*_genotype.tsv
  confidence_parser: t1k_genotype_confidence
  confidence_sample_from_path_regex: /results/([^./]+)/t1k/
  modality: wgs
  parser: t1k_table
  result_glob: /scratch/project_2008084/hla_calibration/wgs/results/**/*_t1k.txt
  sample_from_path_regex: /([^/]+)_t1k\.txt$
  tool: T1K
truth:
  acquisition_date: '2014-07-25'
  imgt_hla_version: 3.59.0
  path: /scratch/project_2008084/pihla-publish/analysis/1000g_realdata/wgs_wave1_inputs/truth_long.tsv
  source: ftp://ftp.1000genomes.ebi.ac.uk/vol1/ftp/technical/working/20140725_hla_genotypes/
  supported_loci:
  - A
  - B
  - C

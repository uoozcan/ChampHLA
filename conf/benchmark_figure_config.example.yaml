truth:
  imgt_hla_version: 3.59.0
  path: /absolute/path/to/1000G_truth.tsv
  source: ftp://ftp.1000genomes.ebi.ac.uk/vol1/ftp/technical/working/20140725_hla_genotypes/
  hierarchy:
    - orthogonal_clinical_typing
    - targeted_hla_ngs
    - public_reference_truth

benchmark:
  resolution: 2
  secondary_resolutions:
    - 2
    - 3
  consensus:
    min_support: 0.55
    min_margin: 0.15

runs:
  - tool: SpecHLA
    modality: wes
    parser: spec_hla_result
    result_glob: /absolute/path/to/wes/spechla/**/hla.result.txt
    runtime_glob: /absolute/path/to/wes/spechla/**/time.log
    sample_from_path_regex: /([^/]+)/hla\.result\.txt$

  - tool: OptiType
    modality: wes
    parser: optitype_tsv
    result_glob: /absolute/path/to/wes/optitype/**/*_result.tsv
    runtime_glob: /absolute/path/to/wes/optitype/**/time.log
    sample_from_path_regex: /([^/]+)/[^/]+_result\.tsv$
    confidence_parser: optitype_result_objective

  - tool: ArcasHLA
    modality: rnaseq
    parser: arcashla_json
    result_glob: /absolute/path/to/rnaseq/arcashla/**/*.genotype.json
    sample_from_path_regex: /([^/]+)/[^/]+\.genotype\.json$
    confidence_glob: /absolute/path/to/rnaseq/arcashla_confidence.tsv
    confidence_parser: long_confidence_table
    confidence_defaults:
      target_reads: 50

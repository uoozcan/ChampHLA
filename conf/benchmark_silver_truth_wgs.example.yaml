# Example: benchmark the main scaffold (other HLA typers + Champion-Challenger)
# against SILVER-STANDARD truth generated by Locityper + Immuannot.
#
# Workflow:
#   1. Run the pipeline with --generate_truth on the WGS/long-read cohort to
#      produce results/silver_truth/truth_long.tsv (+ truth_provenance.tsv).
#   2. VALIDATE that truth against gold first:
#        bin/validate_silver_truth.py --silver <generated> \
#            --gold analysis/1000g_realdata/full_cohort_inputs/truth_long.tsv \
#            --output silver_truth_validation.tsv
#   3. Point truth.path below at the generated truth and run hla_benchmark.py.
#
# truth.generated_from lists the truth-source tools; the harness guardrail
# (apply_truth_source_guardrail) AUTO-DROPS any runs: entry for these tools to
# prevent circularity — so even if a Locityper/Immuannot run is left in below,
# it will be excluded from evaluation (with a logged warning).

benchmark:
  resolution: 2
  secondary_resolutions:
  - 2
  - 3
  champion_challenger:
    enabled: true
    fallback_method: weighted_consensus
    champion_by_gene:
      A: OptiType
      B: OptiType
      C: OptiType
    override_policy:
      min_challenger_support_fraction: 0.35
      min_challenger_margin: 0.0
      min_supporting_tools: 2
      require_non_ambiguity_override: true

truth:
  # Generated by bin/generate_silver_truth.py (see header). SILVER standard —
  # validate against gold before trusting (bin/validate_silver_truth.py).
  path: /scratch/project_2008084/pihla-publish/analysis/silver_truth_wgs/truth_long.tsv
  source: "Silver standard: Locityper + Immuannot agreement"
  acquisition_date: 2026-06-24
  imgt_hla_version: 3.59.0
  generated_from:
  - Locityper
  - Immuannot
  supported_loci:
  - A
  - B
  - C

runs:
# Evaluated tools only — the orthogonal truth-sources (Locityper/Immuannot) are
# excluded by the guardrail and must NOT appear as evaluated runs here.
- modality: wgs
  parser: long_hla_table
  result_glob: /scratch/project_2008084/hla_calibration/wgs_batches/*/results/**/*_spechla.txt
  sample_from_path_regex: /results/([^/]+)/spechla/
  tool: SpecHLA
- confidence_defaults:
    target_reads: 50
  confidence_glob: /scratch/project_2008084/hla_calibration/wgs_batches/*/results/**/hlahd/*/*/result/*_*.read.txt
  confidence_parser: hlahd_read_confidence
  confidence_sample_from_path_regex: /results/([^/]+)/hlahd/
  modality: wgs
  parser: hlahd_table
  result_glob: /scratch/project_2008084/hla_calibration/wgs_batches/*/results/**/*_hlahd.txt
  sample_from_path_regex: /results/([^/]+)/hlahd/
  tool: HLA-HD
- confidence_glob: /scratch/project_2008084/hla_calibration/wgs_batches/*/results/**/optitype/*/*_result.tsv
  confidence_parser: optitype_result_objective
  confidence_sample_from_path_regex: /results/([^/]+)/optitype/
  modality: wgs
  parser: long_hla_table
  result_glob: /scratch/project_2008084/hla_calibration/wgs_batches/*/results/**/*_optitype.txt
  sample_from_path_regex: /results/([^/]+)/optitype/
  tool: OptiType
- confidence_defaults:
    target_reads: 50
  confidence_glob: /scratch/project_2008084/hla_calibration/wgs_batches/*/results/**/kourami/*.kourami.result
  confidence_parser: kourami_result_confidence
  confidence_sample_from_path_regex: /results/([^/]+)/kourami/
  modality: wgs
  parser: kourami_table
  result_glob: /scratch/project_2008084/hla_calibration/wgs_batches/*/results/**/*_kourami.txt
  sample_from_path_regex: /results/([^/]+)/kourami/
  tool: Kourami
- confidence_defaults:
    target_reads: 50
  confidence_glob: /scratch/project_2008084/hla_calibration/wgs_batches/*/results/**/t1k/t1k_out/*_genotype.tsv
  confidence_parser: t1k_genotype_confidence
  confidence_sample_from_path_regex: /results/([^/]+)/t1k/
  modality: wgs
  parser: t1k_table
  result_glob: /scratch/project_2008084/hla_calibration/wgs_batches/*/results/**/*_t1k.txt
  sample_from_path_regex: /results/([^/]+)/t1k/
  tool: T1K

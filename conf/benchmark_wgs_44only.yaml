truth:
  imgt_hla_version: 3.59.0
  path: /scratch/project_2008084/pihla-publish/analysis/1000g_realdata/full_cohort_inputs/truth_long.tsv
  source: ftp://ftp.1000genomes.ebi.ac.uk/vol1/ftp/technical/working/20140725_hla_genotypes/
  acquisition_date: 2014-07-25
  supported_loci:
    - A
    - B
    - C
    - DRB1
    - DQB1

manifests:
  sequencing_source: /scratch/project_2008084/pihla-publish/analysis/1000g_realdata/full_cohort_inputs/sequencing_source.tsv

benchmark:
  resolution: 2
  secondary_resolutions:
    - 2
    - 3
  split_seed: 1000
  splits:
    training: calibration
    validation: threshold_tuning
    holdout: final_reporting
  consensus:
    min_support: 0.55
    min_margin: 0.15

runs:
  - tool: SpecHLA
    modality: wgs
    parser: long_hla_table
    result_glob: /scratch/project_2008084/hla_calibration/wgs_batches/*/results/**/*_spechla.txt
    sample_from_path_regex: /([^/]+)_spechla\.txt$

  - tool: HLA-HD
    modality: wgs
    parser: hlahd_table
    result_glob: /scratch/project_2008084/hla_calibration/wgs_batches/*/results/**/*_hlahd.txt
    sample_from_path_regex: /([^/]+)_hlahd\.txt$

  - tool: ArcasHLA
    modality: wgs
    parser: long_hla_table
    result_glob: /scratch/project_2008084/hla_calibration/wgs_batches/*/results/**/*_arcashla.txt
    sample_from_path_regex: /([^/]+)_arcashla\.txt$

  - tool: OptiType
    modality: wgs
    parser: long_hla_table
    result_glob: /scratch/project_2008084/hla_calibration/wgs_batches/*/results/**/*_optitype.txt
    sample_from_path_regex: /([^/]+)_optitype\.txt$

  - tool: POLYSOLVER
    modality: wgs
    parser: polysolver_table
    result_glob: /scratch/project_2008084/hla_calibration/wgs_batches/*/results/**/*_polysolver.txt
    sample_from_path_regex: /([^/]+)_polysolver\.txt$

  - tool: Kourami
    modality: wgs
    parser: kourami_table
    result_glob: /scratch/project_2008084/hla_calibration/wgs_batches/*/results/**/*_kourami.txt
    sample_from_path_regex: /([^/]+)_kourami\.txt$

  - tool: T1K
    modality: wgs
    parser: t1k_table
    result_glob: /scratch/project_2008084/hla_calibration/wgs_batches/*/results/**/*_t1k.txt
    sample_from_path_regex: /([^/]+)_t1k\.txt$

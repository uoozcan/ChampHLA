# Example Configuration for HLA Typing Pipeline
# Copy this file to params.yaml and customize for your environment

# ============================================================
# INPUT/OUTPUT CONFIGURATION
# ============================================================

# Path to input files (directory or specific file)
input: null  # set to your BAM/CRAM/FASTQ directory

# Input type: 'bam', 'cram', or 'fastq'
input_type: 'fastq'

# Output directory
outdir: './results'

# ============================================================
# TOOL SELECTION
# ============================================================

# Comma-separated list of tools to run
# Available: optitype, arcashla, spechla, hlahd, polysolver, kourami, t1k, seq2hla
tools: 'optitype,arcashla,spechla,hlahd'

# ============================================================
# REFERENCE GENOME
# ============================================================

# Reference genome build: 'hg19' or 'hg38'
reference_build: 'hg38'

# ============================================================
# TOOL-SPECIFIC PARAMETERS
# ============================================================

## OptiType
# Sequence type: 'dna' or 'rna'
optitype_seq_type: 'dna'

## ArcasHLA
# Genes for ArcasHLA typing
arcashla_genes: 'A,B,C,DQA1,DQB1,DRB1'

## SpecHLA
# Genes for SpecHLA typing
spechla_genes: 'A,B,C,DQA1,DQB1,DRB1'

# Exon-only mode for SpecHLA (0 or 1)
# IMPORTANT: Set to 1 for exome data!
spechla_exon_only: 0

## HLA-HD
hlahd_genes: 'A,B,C,DQA1,DQB1,DRB1'
hlahd_db: null  # path to HLA-HD bowtie2 database directory

## Kourami
kourami_dir: null
kourami_db: null
kourami_hs38_ref: null

## Seq type / modality hint
seq_type: 'dna'  # dna or rna
run_modality: null  # optional override: wgs|wes|rnaseq

## Weighted consensus runtime options
consensus_weight_file: null
consensus_min_weight: 0.0
consensus_use_gene_specific_weights: false

# ============================================================
# HLA REGION EXTRACTION (OPTIONAL)
# ============================================================

# Extract HLA region before processing (saves disk space)
extract_hla_region: false

# HLA region coordinates (chromosome 6)
hla_region_start: 28000000
hla_region_end: 34000000

# ============================================================
# MAJORITY VOTING / CONSENSUS CALLING
# ============================================================

# Enable consensus calling across tools
enable_majority_voting: false

# Minimum number of tools required for consensus
mv_min_tools: 2

# Resolution level: 4 (2-field) or 4 (4-field)
mv_resolution: 2

# Genes for majority voting
mv_genes: 'A,B,C,DQA1,DQB1,DRB1'

# ============================================================
# RESOURCE LIMITS
# ============================================================

# Maximum CPUs per process
max_cpus: 20

# Maximum memory per process
max_memory: '180.GB'

# Maximum time per process
max_time: '24.h'

# ============================================================
# HPC CONFIGURATION (SLURM)
# ============================================================
# Site-specific paths (hlahd_db, t1k_hlaidx, samtools_bin_dir, samtools_wrapper,
# singularity_cache_dir, arcashla_container_opts_extra, kourami_container_opts_extra)
# are set to null here. For CSC Puhti, use:
#   -params-file conf/puhti_params.yaml
# For other HPC sites, copy conf/puhti_params.yaml and adjust paths.

# SLURM account
slurm_account: null

# SLURM partition
slurm_partition: 'small'

# ============================================================
# OTHER OPTIONS
# ============================================================

# Save intermediate files (FASTQ conversions, etc.)
save_intermediate: false

# ============================================================
# USAGE EXAMPLES
# ============================================================

# Example 1: RNA-seq data with OptiType and ArcasHLA
# nextflow run main.nf -params-file params.yaml -profile docker

# Example 2: Exome data with SpecHLA (exon-only mode)
# Set: spechla_exon_only: 1
# Set: tools: 'spechla'
# nextflow run main.nf -params-file params.yaml -profile singularity

# Example 3: All tools with consensus calling on CSC Puhti
# Set: enable_majority_voting: true
# Set: tools: 'optitype,arcashla,spechla,hlahd'
# nextflow run main.nf -params-file params.yaml -params-file conf/puhti_params.yaml -profile puhti -resume
# (conf/puhti_params.yaml supplies the site-specific paths; your params.yaml supplies the run settings)

# ============================================================
# NOTES
# ============================================================
#
# 1. For exome data, ALWAYS set spechla_exon_only: 1
# 2. Use -resume to continue failed runs
# 3. On CSC Puhti, use -profile puhti,singularity
# 4. Check logs in .nextflow.log and results/*/logs/
# 5. Container images should be pre-downloaded on Puhti

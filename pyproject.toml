[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "champhla-publication-candidate"
version = "0.1.0"
description = "Frozen ChampHLA publication and confirmation candidate"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest==8.3.5"]
refformer-cpu = ["numpy==1.26.4", "torch==2.6.0"]

[project.scripts]
build_subject_exposure_ledger = "champhla_recovery.cli:build_subject_exposure_ledger_main"
prepare_locked_1000g_truth = "champhla_recovery.cli:prepare_locked_1000g_truth_main"
freeze_extension_rosters = "champhla_recovery.cli:freeze_extension_rosters_main"
audit_native_caller_outputs = "champhla_confirmation.cli:audit_wgs_inputs_main"
audit_wgs_inputs = "champhla_confirmation.cli:audit_wgs_inputs_main"
run_truth_blind_predictions = "champhla_confirmation.cli:run_truth_blind_predictions_main"
freeze_confirmation_bundle = "champhla_confirmation.cli:freeze_confirmation_bundle_main"
validate_prediction_freeze = "champhla_confirmation.cli:validate_prediction_freeze_main"
check_confirmation_capacity = "champhla_confirmation.cli:check_confirmation_capacity_main"
build_overlap_crosswalk = "champhla_confirmation.cli:build_overlap_crosswalk_main"
simulate_confirmation_power = "champhla_confirmation.cli:simulate_confirmation_power_main"
build_hprc_release2_candidates = "champhla_confirmation.cli:build_hprc_release2_candidates_main"
select_hprc_confirmation_roster = "champhla_confirmation.cli:select_hprc_confirmation_roster_main"
build_frozen_raw_cc_policy = "champhla_confirmation.cli:build_frozen_raw_cc_policy_main"
sanitize_ihwg_registry = "champhla_confirmation.cli:sanitize_ihwg_registry_main"
scout_ihwg_public_reads = "champhla_confirmation.cli:scout_ihwg_public_reads_main"
build_ihwg_provenance_review_packet = "champhla_confirmation.cli:build_ihwg_provenance_review_packet_main"
finalize_ihwg_read_roster = "champhla_confirmation.cli:finalize_ihwg_read_roster_main"
collect_full_cram_wgs_pilot = "champhla_confirmation.cli:collect_full_cram_wgs_pilot_main"
audit_dataset_discovery_registry = "champhla_confirmation.cli:audit_dataset_discovery_registry_main"
audit_run_manifest = "champhla_confirmation.cli:audit_run_manifest_main"
freeze_run_manifest = "champhla_confirmation.cli:freeze_run_manifest_main"
initialize_run_ledger = "champhla_confirmation.cli:initialize_run_ledger_main"
transition_run_ledger = "champhla_confirmation.cli:transition_run_ledger_main"
audit_roihu_environment = "champhla_confirmation.cli:audit_roihu_environment_main"
freeze_workflow_lock = "champhla_confirmation.cli:freeze_workflow_lock_main"
validate_workflow_lock = "champhla_confirmation.cli:validate_workflow_lock_main"
assess_roihu_storage = "champhla_confirmation.cli:assess_roihu_storage_main"
plan_roihu_cleanup = "champhla_confirmation.cli:plan_roihu_cleanup_main"
build_hprc_assembly_truth = "champhla_confirmation.cli:build_hprc_assembly_truth_main"
collect_roihu_outputs = "champhla_confirmation.cli:collect_roihu_outputs_main"
build_nci60_run_manifest = "champhla_confirmation.cli:build_nci60_run_manifest_main"
build_same_resource_run_manifest = "champhla_confirmation.cli:build_same_resource_run_manifest_main"
resolve_same_resource_index_checksums = "champhla_confirmation.cli:resolve_same_resource_index_checksums_main"
build_hprc_run_manifest = "champhla_confirmation.cli:build_hprc_run_manifest_main"
validate_hprc_truth_protocol = "champhla_confirmation.cli:validate_hprc_truth_protocol_main"
freeze_release_bundle = "champhla_recovery.cli:freeze_release_bundle_main"
audit_release_readiness = "champhla_recovery.cli:audit_release_readiness_main"
join_truth_once = "champhla_confirmation.cli:join_external_truth_main"
evaluate_confirmation = "champhla_confirmation.cli:evaluate_confirmation_main"
render_manuscript_tables = "champhla_recovery.cli:render_manuscript_tables_main"
audit_manuscript_claims = "champhla_recovery.cli:audit_manuscript_claims_main"
independent_recount = "champhla_recovery.cli:independent_recount_main"
build_originals_manifest = "champhla_recovery.cli:build_originals_manifest_main"
extract_source_manuscript = "champhla_recovery.cli:extract_source_manuscript_main"
build_1000g_assay_manifest = "champhla_recovery.cli:build_1000g_assay_manifest_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-markers"
